# Foundry toolchain pin: see repo-root `.foundry-version` (v1.7.1) and docs/TOOL_VERSIONS.md
# Install: foundryup -i v1.7.1

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read-write", path = "../packages/chain-manifest/deployments" },
  { access = "read", path = "../specs" },
]

# WP-025 custody invariants — agreed CI default; docs/WP-025_CONTRACT_INVARIANTS.md for higher runs.
[invariant]
runs = 256
depth = 32
fail_on_revert = false
call_override = false

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
