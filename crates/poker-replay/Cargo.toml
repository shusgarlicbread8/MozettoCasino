[package]
name = "poker-replay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native CLI replay verifier — WP-035 fixtures + WP-064 PokerEventV1 chains"
publish = false

[[bin]]
name = "poker-replay"
path = "src/main.rs"

[dependencies]
poker-core = { path = "../poker-core" }
protocol-vectors-rs = { path = "../protocol-vectors-rs" }
alloy-primitives = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
