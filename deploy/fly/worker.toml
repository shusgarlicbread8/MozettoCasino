# Fly.io recipe — settlement / checkpoint worker.
# Exposes /health for checks; primary work is the poll loop.

app = 'mozetto-worker-staging'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.worker'

[env]
  NODE_ENV = 'production'
  SETTLEMENT_POLL_MS = '15000'
  ENABLE_MOCK_VRF = '0'
  ATTESTOR_REQUIRE_DISTINCT_KEYS = '1'

[http_service]
  internal_port = 4011
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '20s'
    timeout = '5s'
    grace_period = '40s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
