# Fly.io recipe — mozetto-game (WebSocket tables). Keep machines warm.
# Multi-replica requires REDIS_URL (WP-080 leases).

app = 'mozetto-game-staging'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.game'

[env]
  NODE_ENV = 'production'
  COOKIE_SAMESITE = 'none'
  COOKIE_SECURE = '1'
  OUTBOX_STORE = 'postgres'

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '40s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
