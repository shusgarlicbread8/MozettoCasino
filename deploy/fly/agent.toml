# Fly.io recipe — agent-runtime (mock / Season 1 provider HTTP).

app = 'mozetto-agent-staging'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.agent'

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 4002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
