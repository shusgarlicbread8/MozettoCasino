# Backend services for Mozetto (WebSockets are not supported on Vercel).
# Connect this repo in Render → New → Blueprint.
services:
  - type: web
    name: mozetto-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SIWE_DOMAIN
        sync: false
      - key: SIWE_URI
        sync: false
      - key: NEXT_PUBLIC_GAME_HTTP_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false

  - type: web
    name: mozetto-chain-indexer
    runtime: docker
    dockerfilePath: ./Dockerfile.indexer
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MOZETTO_CHAIN_ENV
        sync: false
      - key: BASE_SEPOLIA_RPC_URL
        sync: false
      - key: BASE_RPC_URL
        sync: false
      - key: ANVIL_RPC_URL
        sync: false
      - key: ARENA_VAULT_ADDRESS
        sync: false
      - key: INDEXER_CONFIRMATIONS
        value: "3"
      - key: INDEXER_POLL_MS
        value: "8000"

  - type: web
    name: mozetto-game
    runtime: docker
    dockerfilePath: ./Dockerfile.game
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
